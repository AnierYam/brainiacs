<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f6f8fc;
      color: #1f2a37;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrapper {
      width: 100%;
      padding: 28px 12px;
      box-sizing: border-box;
    }
    .card {
      max-width: 620px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(90deg, #1f2a8f 0%, #2f04b9 100%);
      color: #ffffff;
      padding: 16px 20px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .content {
      padding: 24px 20px 8px;
      font-size: 15px;
      line-height: 1.55;
    }
    .content p {
      margin: 0 0 14px;
    }
    .code-box {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 10px;
      background: #f1f5ff;
      border: 1px solid #c7d3ff;
      color: #1f2a8f;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
    }
    .button {
      display: inline-block;
      margin: 10px 0 14px;
      background: #79c93d;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-weight: 700;
      font-size: 14px;
    }
    .meta {
      margin-top: 8px;
      color: #4b5563;
      font-size: 13px;
    }
    .footer {
      border-top: 1px solid #e5e7eb;
      margin-top: 12px;
      padding: 14px 20px 18px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">Brainiacs</div>
      <div class="content">
        {% block content %}{% endblock %}
        {% if cta_url and cta_label %}
          <p><a href="{{ cta_url }}" class="button">{{ cta_label }}</a></p>
        {% endif %}
      </div>
      <div class="footer">
        If you didn't request this, you can ignore this email.
      </div>
    </div>
  </div>
</body>
</html>
