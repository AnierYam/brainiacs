{% extends 'base.html' %}

{% block content %}
  <h1 style="margin-bottom: 40px;">🧠 Brainiacs Learning Path</h1>

  <div style="
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
  ">
    {% for system in systems %}
      <div style="
          display: flex;
          justify-content: {% if forloop.counter|divisibleby:2 %}flex-end{% else %}flex-start{% endif %};
          width: 100%;
      ">
        <a href="{% url 'system_detail' system.id %}" style="
            display: block;
            width: 200px;
            height: 200px;
            padding: 20px;
            border-radius: 16px;
            background: #f0f8ff;
            text-align: center;
            text-decoration: none;
            color: #1f2937;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid #3b82f6;
            transition: transform 0.2s;
            margin: 0 40px;
        " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
          <div style="font-size: 40px;">🤖</div>
          <strong>{{ system.title }}</strong>
          <div style="font-size: 12px; margin-top: 4px;">Click to begin</div>
        </a>
      </div>
    {% endfor %}
  </div>
{% endblock %}
