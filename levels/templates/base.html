{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brainiacs Academy</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }

    .sidebar {
      width: 240px;
      height: 100vh;
      background-color: #fff;
      border-right: 2px solid #4c2fff;
      padding: 20px 10px;
      position: fixed;
    }

    .sidebar img.logo {
      width: 150px;
      display: block;
      margin: 0 auto 30px auto;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sidebar ul li:hover {
      background-color: #f0f0ff;
      border-radius: 6px;
    }

    .sidebar-icon {
      width: 28px;
      height: auto;
      margin-right: 12px;
      vertical-align: middle;
      transform: translateY(1px);
    }

    .sidebar ul li span {
      font-size: 16px;
      color: #222;
    }

    .main-content {
      margin-left: 240px;
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <img src="{% static 'icons/brainiacs_logo.png' %}" alt="Brainiacs Logo" class="logo">
  <ul>
    <li>
      <img src="{% static 'icons/build.png' %}" alt="Build Icon" class="sidebar-icon">
      <span>Build</span>
    </li>
    <li>
      <img src="{% static 'icons/practice.png' %}" alt="Practice Icon" class="sidebar-icon">
      <span>Practice</span>
    </li>
    <li>
      <img src="{% static 'icons/leaderboard.png' %}" alt="Leaderboard Icon" class="sidebar-icon">
      <span>Leaderboard</span>
    </li>
    <li>
      <img src="{% static 'icons/profile.png' %}" alt="Profile Icon" class="sidebar-icon">
      <span>Profile</span>
    </li>
  </ul>
</div>

<div class="main-content">
  {% block content %}
  {% endblock %}
</div>

</body>
</html>
