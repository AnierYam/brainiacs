<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brainiacs</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9fb;
      display: flex;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background-color: #f9f9fb; /* Match page background */
      border-right: 2px solid royalblue;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .sidebar img.logo {
      max-width: 160px;
      height: auto;
      margin-bottom: 1.5rem;
      margin-left: 15px;

    }

    .sidebar a {
      display: block;
      color: #6b7280; /* Grey */
      text-decoration: none;
      margin: 10px 0;
      padding: 6px;
      border-radius: 6px;
      text-align: left;
      width: 100%;
    }

    .sidebar a:hover {
      color: white;
      background-color: #374151;
    }

    .content {
      margin-left: 240px;
      padding: 2rem;
      width: calc(100% - 240px);
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <img src="/media/systems/brainiacs_logo.png" alt="Brainiacs Logo" class="logo" />
    <a href="#">Build</a>
    <a href="#">Practice</a>
    <a href="#">Leaderboard</a>
    <a href="#">Profile</a>
  </div>

  <div class="content">
    {% block content %}
    <!-- Your page-specific content will show here -->
    {% endblock %}
  </div>
</body>
</html>
