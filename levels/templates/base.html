{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brainiacs</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9fb;
      display: flex;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background-color: #f9f9fb;
      border-right: 2px solid royalblue;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .sidebar img.logo {
      max-width: 160px;
      height: auto;
      margin-bottom: 1.5rem;
      margin-left: 15px;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6b7280;
      text-decoration: none;
      margin: 10px 0;
      padding: 6px;
      border-radius: 6px;
      text-align: left;
      width: 100%;
      transition: background-color 0.2s, color 0.2s;
    }

    .sidebar a:hover {
      color: white;
      background-color: #374151;
    }

    .sidebar img.icon {
      width: 24px;
      height: 24px;
    }

    .content {
      margin-left: 240px;
      padding: 2rem;
      width: calc(100% - 240px);
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <img src="{% static 'icons/brainiacs_logo.png' %}" alt="Brainiacs Logo" class="logo" />

    <a href="#"><img src="{% static 'icons/build.png' %}" alt="Build Icon" class="icon"> Build</a>
    <a href="#"><img src="{% static 'icons/practice.png' %}" alt="Practice Icon" class="icon"> Practice</a>
    <a href="#"><img src="{% static 'icons/leaderboard.png' %}" alt="Leaderboard Icon" class="icon"> Leaderboard</a>
    <a href="#"><img src="{% static 'icons/profile.png' %}" alt="Profile Icon" class="icon"> Profile</a>
  </div>

  <div class="content">
    {% block content %}
    <!-- Page-specific content will go here -->
    {% endblock %}
  </div>
</body>
</html>
