{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{% static 'css/icons.css' %}" />
  <link rel="stylesheet" href="{% static 'css/responsive-overrides.css' %}" />
  <title>Mission 1 – Pedro Parts</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #e0f2fe, #f9fafb);
      color: #1f2937;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .back-button {
      position: fixed;
      top: 1.2rem;
      left: 1.6rem;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      border-radius: 999px;
      border: 1px solid #cbd5f5;
      background: #eef2ff;
      color: #1d4ed8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.12);
      z-index: 50;
    }

    .back-button:hover {
      background: #e0e7ff;
    }

    .back-arrow {
      font-size: 1rem;
      line-height: 1;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: #4b5563;
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 1.5rem;
    }

    .parts-table {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      background: #f3f4f6;
    }

    th, td {
      padding: 0.75rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    th:last-child, td:last-child {
      text-align: center;
      width: 90px;
    }

    tr:hover {
      background: #f8fafc;
      cursor: pointer;
    }

    tr.active {
      background: #eef2ff;
    }

    .detail-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      padding: 1.25rem;
      min-height: 320px;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .detail-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111827;
    }

    .detail-meta {
      font-size: 0.95rem;
      color: #4b5563;
    }

    .detail-desc {
      font-size: 0.95rem;
      color: #1f2937;
      line-height: 1.5;
    }

    .viewer {
      width: 100%;
      min-height: 320px;
      border: none;
      border-radius: 0;
      background: transparent;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 0.95rem;
      text-align: center;
      padding: 0.5rem;
      pointer-events: none;
      background: none;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <a href="{% url 'lessons:mission_1' %}" class="back-button">
    <span class="back-arrow">&larr;</span>
    Back to Mission 1
  </a>

  <header class="page-header">
    <h1>Pedro Parts</h1>
    <p>Select a part to see its description and quantity.</p>
  </header>

  <div class="layout" id="parts-layout">
    <div class="parts-table">
      <table id="parts-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody>
          {% for part in parts %}
          <tr data-slug="{{ part.slug }}" data-name="{{ part.name }}" data-qty="{{ part.quantity|default:'-' }}" data-desc="{{ part.description|default:'No description yet.' }}">
            <td>{{ part.name }}</td>
            <td>{{ part.quantity|default:"-" }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="detail-card" id="detail-card">
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-desc" id="detail-desc"></div>
      <div class="viewer" id="viewer">
        <div class="viewer-status" id="viewer-status">Select a part to preview.</div>
        <img id="part-image" alt="Part preview" style="display:none; max-width:100%; max-height:100%; object-fit:contain;" />
      </div>
    </div>
  </div>

  <script>
    (function() {
      const rows = Array.from(document.querySelectorAll('#parts-table tbody tr'));
      const titleEl = document.getElementById('detail-title');
      const metaEl = document.getElementById('detail-meta');
      const descEl = document.getElementById('detail-desc');
      const viewerStatus = document.getElementById('viewer-status');
      const imgEl = document.getElementById('part-image');

      const IMAGE_BASE = "{% static 'lessons/mission1/Part 3/' %}";
      const IMAGE_MAP = {
        "pedro-head": "{% static 'lessons/mission1/part3_icon.png' %}"
      };

      function selectRow(row) {
        rows.forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        const name = row.dataset.name || '';
        const qty = row.dataset.qty || '-';
        const desc = row.dataset.desc || 'No description yet.';
        titleEl.textContent = name;
        metaEl.textContent = `Quantity in kit: ${qty}`;
        descEl.textContent = desc;

        const slug = row.dataset.slug;
        const url = IMAGE_MAP[slug] || (IMAGE_BASE + slug + '.png');
        imgEl.style.display = 'none';
        viewerStatus.style.display = 'flex';
        viewerStatus.textContent = 'Loading preview...';

        imgEl.onload = () => {
          viewerStatus.style.display = 'none';
          imgEl.style.display = 'block';
        };
        imgEl.onerror = () => {
          imgEl.style.display = 'none';
          viewerStatus.textContent = 'No preview available.';
          viewerStatus.style.display = 'flex';
        };
        imgEl.src = url;
      }

      rows.forEach((row) => {
        row.addEventListener('click', () => selectRow(row));
      });

      if (rows.length) {
        selectRow(rows[0]);
      }
    })();
  </script>
</body>
</html>
